[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-source-gateway"
version = "0.1.0"
description = "Thin gateway in front of vLLM for source resolution, model discovery, request forwarding, and Prometheus-safe metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Randy" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_source_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
