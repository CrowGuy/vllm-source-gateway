    base_url: "http://10.0.0.11:8000"
    models:
      - "gpt-oss-120b"

  - name: "gpt-oss-120b-b"
    base_url: "http://10.0.0.12:8000"
    models:
      - "gpt-oss-120b"

  - name: "qwen3-32b-a"
    base_url: "http://10.0.0.21:8000"
    models:
      - "qwen3-32b"

departments:
