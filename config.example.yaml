server:
  host: "0.0.0.0"
  port: 8080
  max_request_body_bytes: 4194304

timeouts:
  connect_seconds: 5
  upstream_request_seconds: 120
  stream_idle_seconds: 30

health:
  enabled: true
  probe_path: "/v1/models"
  check_interval_seconds: 15
  request_timeout_seconds: 3

routing:
  strategy: "round_robin"

security:
  reject_unknown_api_keys: false

upstreams:
  - name: "gpt-oss-120b-a"
    base_url: "http://10.0.0.11:8000"
    models:
      - "gpt-oss-120b"

  - name: "gpt-oss-120b-b"
    base_url: "http://10.0.0.12:8000"
    models:
      - "gpt-oss-120b"

  - name: "qwen3-32b-a"
    base_url: "http://10.0.0.21:8000"
    models:
      - "qwen3-32b"

departments:
  finance:
    api_keys:
      - "finance-prod"

  hr:
    api_keys:
      - "hr-app"

  data_platform:
    api_keys:
      - "dp-prod"
      - "dp-batch"
