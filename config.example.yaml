server:
  host: "0.0.0.0"
  port: 8080
  max_request_body_bytes: 4194304
  max_sse_decode_buffer_bytes: 262144

timeouts:
  connect_seconds: 5
  upstream_request_seconds: 120
  stream_idle_seconds: 30

health:
  enabled: true
  probe_path: "/v1/models"
  check_interval_seconds: 15
  request_timeout_seconds: 3

routing:
  strategy: "round_robin"

security:
  reject_unknown_api_keys: false

upstreams:
  - name: "gpt-oss-120b-a"
    base_url: "http://10.0.0.11:8000"
    authorization_from_env: "UPSTREAM_GPT_OSS_120B_A_TOKEN"
    models:
      - "gpt-oss-120b"

  - name: "gpt-oss-120b-b"
    base_url: "http://10.0.0.12:8000"
    authorization_from_env: "UPSTREAM_GPT_OSS_120B_B_TOKEN"
    models:
      - "gpt-oss-120b"

  - name: "qwen3-32b-a"
    base_url: "http://10.0.0.21:8000"
    authorization_from_env: "UPSTREAM_QWEN3_32B_A_TOKEN"
    models:
      - "qwen3-32b"

model_catalog:
  gpt-oss-120b:
    display_name: "GPT OSS 120B"
    hosted_on: "DGX-A100 production pool"
    use_cases:
      - "coding"
      - "general chat"
      - "long context"
    api_paths:
      - "chat"
      - "responses"
      - "messages"
    context_window: "128k tokens"
    recommended_for:
      - "code agents"
      - "long-form reasoning"
    known_limits:
      - "not intended for embedding workloads"
    example_prompt: "Reply with exactly: hello from gateway"

  qwen3-32b:
    display_name: "Qwen3 32B"
    hosted_on: "Lab GPU Server"
    use_cases:
      - "general chat"
      - "coding"
    api_paths:
      - "chat"
      - "responses"
      - "messages"
    context_window: "32k tokens"
    recommended_for:
      - "interactive assistant use"
    known_limits:
      - "large-context behavior should be validated before production use"
    example_prompt: "Summarize this service in one sentence."

departments:
  finance:
    api_keys_from_env: "DEPT_FINANCE_API_KEYS"

  hr:
    api_keys_from_env: "DEPT_HR_API_KEYS"

  data_platform:
    api_keys_from_env: "DEPT_DATA_PLATFORM_API_KEYS"
