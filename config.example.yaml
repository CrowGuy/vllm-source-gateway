server:
  host: "0.0.0.0"
  port: 8080
  max_request_body_bytes: 4194304
  max_sse_decode_buffer_bytes: 262144

timeouts:
  connect_seconds: 5
  upstream_request_seconds: 120
  stream_idle_seconds: 30

health:
  enabled: true
  probe_path: "/v1/models"
  check_interval_seconds: 15
  request_timeout_seconds: 3

routing:
  strategy: "round_robin"

security:
  reject_unknown_api_keys: false

admission_control:
  # Admission state is in-memory and per process. Run one uvicorn worker when
  # these limits are used in production; N workers make limits approximately N times larger.
  # Model/department limits run after body read and JSON parse, so they protect
  # upstream queues, not gateway ingress CPU/memory during large-body floods.
  # Fairness is by department/model. Use separate bounded departments, such as
  # data_platform_human and data_platform_agent, to isolate human and agent traffic.
  # Department-scoped limits cannot target fallback department="unknown"; reject
  # unknown API keys or use global_model_limits if that traffic must be controlled.
  # Cross-reference validation runs when enabled=true, so validate enabled configs before rollout.
  enabled: false
  default_retry_after_seconds: 30
  global_model_limits:
    gpt-oss-120b:
      max_active_requests: 20
  department_model_limits:
    - department: "data_platform"
      model_name: "gpt-oss-120b"
      max_active_requests: 4
  token_budgets:
    # Token budgets count completed 2xx responses with reliable usage only.
    # They are not hard ceilings: in-flight oversubscription is bounded by
    # active concurrency multiplied by the per-request output cap below.
    - department: "data_platform"
      model_name: "gpt-oss-120b"
      max_tokens: 1000000
      window_seconds: 3600
  request_shape_limits:
    gpt-oss-120b:
      max_request_body_bytes: 4194304
      # Also used as the default output cap when clients omit max_tokens/max_output_tokens.
      max_output_tokens: 4096
      reject_n_greater_than_one: true
  retry_guard:
    enabled: false
    window_seconds: 60
    max_events: 10
    cooldown_seconds: 30

upstreams:
  - name: "gpt-oss-120b-a"
    base_url: "http://10.0.0.11:8000"
    authorization_from_env: "UPSTREAM_GPT_OSS_120B_A_TOKEN"
    models:
      - "gpt-oss-120b"

  - name: "gpt-oss-120b-b"
    base_url: "http://10.0.0.12:8000"
    authorization_from_env: "UPSTREAM_GPT_OSS_120B_B_TOKEN"
    models:
      - "gpt-oss-120b"

  - name: "qwen3-32b-a"
    base_url: "http://10.0.0.21:8000"
    authorization_from_env: "UPSTREAM_QWEN3_32B_A_TOKEN"
    models:
      - "qwen3-32b"

model_catalog:
  gpt-oss-120b:
    display_name: "GPT OSS 120B"
    hosted_on: "DGX-A100 production pool"
    use_cases:
      - "coding"
      - "general chat"
      - "long context"
    api_paths:
      - "chat"
      - "responses"
      - "messages"
    context_window: "128k tokens"
    recommended_for:
      - "code agents"
      - "long-form reasoning"
    known_limits:
      - "not intended for embedding workloads"
    example_prompt: "Reply with exactly: hello from gateway"

  qwen3-32b:
    display_name: "Qwen3 32B"
    hosted_on: "Lab GPU Server"
    use_cases:
      - "general chat"
      - "coding"
    api_paths:
      - "chat"
      - "responses"
      - "messages"
    context_window: "32k tokens"
    recommended_for:
      - "interactive assistant use"
    known_limits:
      - "large-context behavior should be validated before production use"
    example_prompt: "Summarize this service in one sentence."

departments:
  finance:
    api_keys_from_env: "DEPT_FINANCE_API_KEYS"

  hr:
    api_keys_from_env: "DEPT_HR_API_KEYS"

  data_platform:
    api_keys_from_env: "DEPT_DATA_PLATFORM_API_KEYS"
