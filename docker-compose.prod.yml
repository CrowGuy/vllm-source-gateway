services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vllm-source-gateway
    image: vllm-source-gateway:prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    environment:
      VLLM_SOURCE_GATEWAY_CONFIG: /app/config.prod.yaml
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8080/livez", timeout=2).getcode() == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./config.prod.yaml:/app/config.prod.yaml:ro
