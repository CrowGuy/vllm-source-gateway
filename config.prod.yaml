server:
  host: "0.0.0.0"
  port: 8080
  max_request_body_bytes: 4194304
  max_sse_decode_buffer_bytes: 262144

timeouts:
  connect_seconds: 5
  upstream_request_seconds: 120
  stream_idle_seconds: 30

health:
  enabled: true
  probe_path: "/v1/models"
  check_interval_seconds: 15
  request_timeout_seconds: 3

routing:
  strategy: "round_robin"

security:
  reject_unknown_api_keys: false

upstreams:
  - name: "gemma4-a"
    base_url: "http://10.0.201.104:8000"
    authorization_from_env: "UPSTREAM_GEMMA4_A_TOKEN"
    models:
      - "gemma-4-31b"

  #- name: "gemma4-b"
  #  base_url: "http://10.0.201.105:8000"
  #  authorization_from_env: "UPSTREAM_GEMMA4_B_TOKEN"
  #  models:
  #    - "gemma-4-31b"

  #- name: "qwen3-32b-a"
  #  base_url: "http://10.0.201.106:8000"
  #  authorization_from_env: "UPSTREAM_QWEN3_32B_A_TOKEN"
  #  models:
  #    - "qwen3-32b"

departments:
  finance:
    api_keys_from_env: "DEPT_FINANCE_API_KEYS"

  hr:
    api_keys_from_env: "DEPT_HR_API_KEYS"

  data_platform:
    api_keys_from_env: "DEPT_DATA_PLATFORM_API_KEYS"
